<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Spencer Little</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">Spencer Little</a>
        <nav class="nav">
          <a href="/#publications">Publications</a>
          <a href="/#personal-projects">Personal<span class="nav-long"> Projects</span></a>
          <a href="/#team-projects">Team<span class="nav-long"> Projects</span></a>
          <a href="/#archive">Archive</a>
        </nav>
      </div>
      <img class="glider" src="/assets/plane.svg" alt="" aria-hidden="true" width="26" height="19" />
    </header>

    <main>
      <section class="container notfound">
        <svg class="hero-flight" viewBox="0 0 520 150" aria-hidden="true" focusable="false">
          <path id="flight-path" d="M6 20 C110 20 175 86 272 96 S424 114 484 138" fill="none" stroke="var(--ink-3)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0.1 7" />
          <circle cx="6" cy="20" r="3.2" fill="var(--ink)" />
          <g>
            <image href="/assets/plane.svg" x="-30" y="-22.5" width="60" height="45" transform="scale(-1 1)" />
            <animateMotion dur="3.4s" begin="0s" fill="freeze" rotate="auto" calcMode="spline" keyTimes="0;1" keySplines="0.3 0.1 0.25 1">
              <mpath href="#flight-path" />
            </animateMotion>
          </g>
        </svg>
        <p class="hero-tagline">404 · Page not found</p>
        <h1>Off course.</h1>
        <p class="lead">That page doesn't exist, or it has moved. The index has everything that's here.</p>
        <p class="notfound-actions"><a class="btn btn-accent btn-lg" href="/">Back to the index</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> Spencer Little</p>
        <p><a href="https://github.com/Spencer-Little">GitHub</a></p>
      </div>
    </footer>
    <script src="/main.js" defer></script>
  </body>
</html>
